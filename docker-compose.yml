services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 4
    cpuset: "0-3"
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
    command: --check-caps false --ISCAgent false
    ports:
      - 1972
      - 52773
      - 53773
    volumes:
      - ./:/home/irisowner/dev
